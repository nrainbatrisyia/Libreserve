<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset - LibReserve</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #42255c;
            font-family: Arial, sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .top-logo {
            position: absolute;
            top: 30px;
            right: 40px;
        }

        .top-logo img {
            width: 90px;
        }

        .page-title {
            margin-top: 120px;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 1px;
        }


        .container {
            background-color: #ffffff;
            color: #333;
            width: 80%;
            max-width: 900px; 
            padding: 70px 80px;
            border-radius: 20px;
            margin-top: 40px;
            position: relative;
            text-align: center;
        }

        .next-text {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 18px;
            color: #333;
            font-weight: bold;
            cursor: pointer;
        }

        .people-icon {
            width: 250px;
            margin-top: 20px;
        }
    
        h2 {
            font-size: 26px;
            font-weight: bold;
            margin-top: 20px;
        }

        p {
            font-size: 18px;
            margin-top: 15px;
            line-height: 1.4;
        }
    </style>
</head>

<body>

    <div class="top-logo">
        <img src="picture/white logo.jpg" alt="LibReserve Logo">
    </div>

    <div class="page-title">WELCOME TO LIBRESERVE</div>

    <div class="container">

        <div class="next-text">NEXT →</div>

        <h2>YOUR LIBRESERVE ACCOUNT IS READY</h2>
        <img src="picture/people icon.jpg"  class="people-icon">

        <p>Your account is now active. Please proceed to the sign-in page to access the system.</p>

    </div>

</body>
</html>
