<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Log In</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #3f2262; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .page-title {
            color: white;
            font-size: 32px;
            font-weight: bold;
            margin-top: 100px;
            letter-spacing: 1px;
        }

        .top-logo {
            position: absolute;
            top: 30px;
            right: 40px;
            text-align: center;
            color: white;
        }

        .top-logo img {
            width: 100px;
        }

        .top-logo p {
            margin: 5px 0 0 0;
            font-size: 16px;
        }

        .login-box {
            background-color: #e5e7eb;
            width: 480px;
            padding: 40px;
            margin-top: 60px;
            border-radius: 20px;
            text-align: center;
        }

        .login-box h2 {
            margin-top: 0;
            font-size: 22px;
            margin-bottom: 25px;
            font-weight: bold;
            color: #222;
        }

        .input-section {
            text-align: left;
            margin-bottom: 18px;
        }

        .input-section label {
            font-size: 14px;
            font-weight: bold;
            color: #222;
        }

        .input-section input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background-color: #7fc443;
            color: #133a1f;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }

        .login-button:hover {
            background-color: #a0e86a;
        }
    </style>
</head>
<body>
    <div class="page-title">WELCOME TO LIBRESERVE</div>

    <div class="top-logo">
        <img src="picture/white logo.jpg" alt="LibReserve Logo">
    </div>

    <div class="login-box">
        <h2>RESET ACCOUNT PASSWORD</h2>

        <div class="input-section">
            <label>NEW PASSWORD</label>
            <input type="text" placeholder="Please enter your password">
        </div>

        <div class="input-section">
            <label>CONFIRM NEW PASSWORD</label>
            <input type="password" placeholder="Please enter your password">
        </div>

        <button class="login-button"> RESET PASSWORD </button>

    </div>
</body>
</html>
